        <text x="333" y="82" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="26" font-weight="900" fill="#fffdf7">BR</text>
    </g>
    <text x="286" y="61" text-anchor="end" font-family="Heebo, Arial, sans-serif" font-size="31" font-weight="900" fill="#0e3424">ברכה רוזנברג</text>
    <text x="286" y="91" text-anchor="end" font-family="Heebo, Arial, sans-serif" font-size="16" font-weight="800" fill="#9b7829">בניית אתרים ועיצוב חוויות דיגיטליות</text>
    <line x1="77" y1="105" x2="286" y2="105" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <text x="286" y="125" text-anchor="end" font-family="Heebo, Arial, sans-serif" font-size="12" font-weight="800" fill="#506055">Professional Web Design</text>
