<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" role="img" aria-labelledby="title desc">
    <title id="title">ברכה רוזנברג - בניית אתרים</title>
    <desc id="desc">לוגו יוקרתי בגווני ירוק וזהב עבור ברכה רוזנברג</desc>
    <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f3df96"/>
            <stop offset="0.45" stop-color="#c9a243"/>
            <stop offset="1" stop-color="#8f6b22"/>
        </linearGradient>
        <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1f6b46"/>
            <stop offset="1" stop-color="#0e3424"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0e3424" flood-opacity="0.24"/>
        </filter>
    </defs>
    <g filter="url(#shadow)">
