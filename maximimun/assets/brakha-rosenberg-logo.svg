        <circle cx="333" cy="75" r="35" fill="none" stroke="url(#gold)" stroke-width="2"/>
        <path d="M309 83c11-23 30-34 56-32-12 22-30 33-56 32Z" fill="url(#gold)" opacity="0.96"/>
