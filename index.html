<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Intel tasks manager</title>
  <style>
    :root {
      --intel-blue: #0068B5;
      --intel-dark: #00285A;
      --intel-light: #E9F2FA;
      --high:   #D32F2F;
      --medium: #F57C00;
      --low:    #388E3C;
      --blocked: #9333EA;
      --done-bg: #F5F5F5;
      --border: #CBD5E1;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #F0F4F8;
      color: #1E293B;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--intel-dark), var(--intel-blue));
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    header .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header svg { flex-shrink: 0; }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .5px; }
    header p  { font-size: .85rem; opacity: .8; }
    header .header-right {
      text-align: right;
      font-size: .75rem;
      opacity: .85;
    }
    header .version {
      font-weight: 600;
      font-size: .85rem;
      margin-bottom: 2px;
    }

    /* ── Layout ── */
    .container {
      max-width: 1220px;
      margin: 32px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: minmax(320px, 380px) minmax(0, 1fr);
      grid-template-areas: "add tasks";
      gap: 24px;
      align-items: start;
    }

    .add-panel { grid-area: add; min-width: 0; }
    .tasks-panel { grid-area: tasks; min-width: 0; }

    /* ── Add-Task Card ── */
    .card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 6px rgba(0,0,0,.1);
      padding: 24px;
      margin-bottom: 24px;
    }
    .card h2 { font-size: 1.1rem; color: var(--intel-dark); margin-bottom: 16px; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-grid .full { grid-column: 1 / -1; }

    label { display: block; font-size: .8rem; font-weight: 600; color: #475569; margin-bottom: 4px; }

    input[type="text"], select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
      background: #FAFAFA;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--intel-blue);
      background: #fff;
    }
    textarea { resize: vertical; min-height: 80px; }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 7px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--intel-blue); color: #fff; }
    .btn-primary:hover { opacity: .88; }
    .btn-danger  { background: #EF4444; color: #fff; padding: 5px 12px; font-size: .8rem; }
    .btn-done    { background: #22C55E; color: #fff; padding: 5px 12px; font-size: .8rem; }
    .btn-undo    { background: #94A3B8; color: #fff; padding: 5px 12px; font-size: .8rem; }
    .btn-blocked { background: var(--blocked); color: #fff; padding: 5px 12px; font-size: .8rem; }

    /* ── Filters ── */
    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }
    .filters span { font-size: .85rem; font-weight: 600; color: #475569; }
    .filter-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-size: .82rem;
      cursor: pointer;
      transition: all .15s;
      font-weight: 600;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--intel-blue);
      color: #fff;
      border-color: var(--intel-blue);
    }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: #fff;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: .82rem;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-high   { background: var(--high); }
    .dot-medium { background: var(--medium); }
    .dot-low    { background: var(--low); }
    .dot-done    { background: #94A3B8; }
    .dot-blocked { background: var(--blocked); }

    /* ── Task List ── */
    #task-list { display: flex; flex-direction: column; gap: 12px; }

    .task-item {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
      padding: 16px 20px;
      border-left: 5px solid var(--intel-blue);
      cursor: grab;
      transition: box-shadow .2s, opacity .2s, transform .2s;
      user-select: none;
    }
    .task-item:hover { box-shadow: 0 3px 12px rgba(0,0,0,.13); }
    .task-item:active { cursor: grabbing; }
    .task-item.dragging { opacity: .45; transform: scale(.99); }
    .task-item.drag-over-top { box-shadow: inset 0 3px 0 var(--intel-blue), 0 3px 12px rgba(0,0,0,.13); }
    .task-item.drag-over-bottom { box-shadow: inset 0 -3px 0 var(--intel-blue), 0 3px 12px rgba(0,0,0,.13); }
    .task-item.done  { border-left-color: #CBD5E1; background: var(--done-bg); opacity: .75; }
    .task-item.priority-High             { border-left-color: var(--high); }
    .task-item.priority-Medium           { border-left-color: var(--medium); }
    .task-item.priority-Low              { border-left-color: var(--low); }
    .task-item.blocked:not(.done)        { border-left-color: var(--blocked); }
    .badge-Blocked { background: #F3E8FF; color: var(--blocked); }

    .task-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .task-title {
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
    }
    .task-item.done .task-title {
      text-decoration: line-through;
      color: #94A3B8;
    }

    .badge {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: .75rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-High   { background: #FDECEA; color: var(--high); }
    .badge-Medium { background: #FFF3E0; color: var(--medium); }
    .badge-Low    { background: #E8F5E9; color: var(--low); }
    .badge-Done   { background: #F1F5F9; color: #64748B; }

    .task-meta {
      font-size: .78rem;
      color: #94A3B8;
      margin-top: 4px;
    }

    .task-comment {
      margin-top: 10px;
      padding: 8px 12px;
      background: var(--intel-light);
      border-radius: 6px;
      font-size: .85rem;
      color: #334155;
      white-space: pre-wrap;
    }
    .task-comment::before {
      content: "💬 ";
      font-size: .8rem;
    }

    .task-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .task-actions .btn { cursor: pointer; }

    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: #94A3B8;
      font-size: .95rem;
    }
    .empty-state svg { margin-bottom: 12px; opacity: .4; }

    /* ── Edit Modal ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: var(--radius);
      padding: 28px;
      width: min(500px, 95vw);
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .modal h2 { color: var(--intel-dark); margin-bottom: 18px; font-size: 1.1rem; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    .btn-secondary { background: #E2E8F0; color: #334155; }
    .btn-secondary:hover { background: #CBD5E1; }
    .btn-import-export { padding: 5px 16px !important; font-size: .8rem !important; }

    input[type="time"], input[type="number"] {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
      background: #FAFAFA;
    }
    input[type="time"]:focus, input[type="number"]:focus {
      border-color: var(--intel-blue);
      background: #fff;
    }

    /* ── Recurring card ── */
    .recurring-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .recurring-header h2 { font-size: 1.1rem; color: var(--intel-dark); }
    .recurring-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #F8FAFC;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1.5px solid var(--border);
    }
    .recurring-row-info { flex: 1; }
    .recurring-row-title { font-weight: 600; font-size: .9rem; }
    .recurring-row-meta  { font-size: .75rem; color: #64748B; }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        grid-template-areas:
          "add"
          "tasks";
      }
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: 1; }
      header h1 { font-size: 1.2rem; }
    }

    /* ── Footer ── */
    footer {
      background: linear-gradient(135deg, var(--intel-dark), var(--intel-blue));
      color: #fff;
      padding: 12px 32px;
      text-align: center;
      font-size: .75rem;
      margin-top: 48px;
      border-top: 3px solid var(--intel-blue);
      opacity: .85;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <rect width="36" height="36" rx="8" fill="white" fill-opacity="0.15"/>
      <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle"
            font-family="Segoe UI,Arial" font-weight="700" font-size="15" fill="white">✔</text>
    </svg>
    <div>
      <h1>Intel Tasks Manager</h1>
      <p>Track, prioritize, and manage your work items</p>
    </div>
  </div>
  <div class="header-right">
    <div class="version">v5.2</div>
  </div>
</header>

<div class="container">

  <aside class="add-panel">
    <!-- Add Task Card -->
    <div class="card">
      <h2>+ Add New Task</h2>
      <div class="form-grid">
        <div class="full">
          <label for="task-title">Task Title *</label>
          <input type="text" id="task-title" placeholder="Describe the task…" />
        </div>
        <div>
          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="High">🔴 High</option>
            <option value="Medium" selected>🟠 Medium</option>
            <option value="Low">🟢 Low</option>
          </select>
        </div>
        <div>
          <label for="task-due">Due Date (optional)</label>
          <input type="text" id="task-due" placeholder="e.g. 2026-05-15" />
        </div>
        <div class="full">
          <label for="task-comment">Comment (optional)</label>
          <textarea id="task-comment" placeholder="Add any notes or context…"></textarea>
        </div>
        <div class="full" style="text-align:right">
          <button class="btn btn-primary" onclick="addTask()">Add Task</button>
        </div>
      </div>
    </div>

    <!-- Recurring Tasks Card -->
    <div class="card" id="recurring-card">
      <div class="recurring-header" onclick="toggleRecurringCard()">
        <h2>🔁 Recurring Tasks</h2>
        <span id="recurring-toggle-icon" style="font-size:1rem;color:#64748B">▼</span>
      </div>
      <div id="recurring-card-body" style="margin-top:16px">
        <div class="form-grid">
          <div class="full">
            <label>Task Title *</label>
            <input type="text" id="rec-title" placeholder="e.g. Weekly status report…" />
          </div>
          <div>
            <label>Priority</label>
            <select id="rec-priority">
              <option value="High">🔴 High</option>
              <option value="Medium" selected>🟠 Medium</option>
              <option value="Low">🟢 Low</option>
            </select>
          </div>
          <div>
            <label>Repeat</label>
            <select id="rec-freq" onchange="updateRecurringForm()">
              <option value="daily">Every Day</option>
              <option value="weekly">Every Week</option>
              <option value="monthly">Every Month</option>
            </select>
          </div>
          <div id="rec-dow-wrap" style="display:none">
            <label>Day of Week</label>
            <select id="rec-dow">
              <option value="0">Sunday</option>
              <option value="1">Monday</option>
              <option value="2">Tuesday</option>
              <option value="3">Wednesday</option>
              <option value="4">Thursday</option>
              <option value="5">Friday</option>
              <option value="6">Saturday</option>
            </select>
          </div>
          <div id="rec-dom-wrap" style="display:none">
            <label>Day of Month (1–31)</label>
            <input type="number" id="rec-dom" min="1" max="31" value="1" />
          </div>
          <div>
            <label>Add task at time</label>
            <input type="time" id="rec-time" value="08:00" />
          </div>
          <div class="full">
            <label>Comment (optional)</label>
            <textarea id="rec-comment" placeholder="Notes for this recurring task…" style="min-height:60px"></textarea>
          </div>
          <div class="full" style="text-align:right">
            <button class="btn btn-primary" onclick="addRecurring()">+ Add Recurring Task</button>
          </div>
        </div>
        <div id="recurring-list" style="margin-top:16px"></div>
      </div>
    </div>
  </aside>

  <main class="tasks-panel">
    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Filters -->
    <div class="filters">
      <span>Filter:</span>
      <button class="filter-btn active" onclick="setFilter('All', this)">All</button>
      <button class="filter-btn" onclick="setFilter('High', this)">🔴 High</button>
      <button class="filter-btn" onclick="setFilter('Medium', this)">🟠 Medium</button>
      <button class="filter-btn" onclick="setFilter('Low', this)">🟢 Low</button>
      <button class="filter-btn" onclick="setFilter('Done', this)">✔ Done</button>
      <button class="filter-btn" onclick="setFilter('Blocked', this)">🚫 Blocked</button>
    </div>

    <!-- Export / Import / Share -->
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;">
      <button class="btn btn-secondary btn-import-export" onclick="exportTasks()">⬇ Export json</button>
      <button class="btn btn-secondary btn-import-export" onclick="document.getElementById('import-file').click()">⬆ Import json</button>
      <button class="btn btn-primary btn-import-export"   onclick="shareLink()">🔗 Share Link</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importTasks(this)"/>
    </div>

    <!-- Task List -->
    <div id="task-list"></div>
  </main>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2>Edit Task</h2>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div style="grid-column:1/-1">
        <label>Task Title *</label>
        <input type="text" id="edit-title" />
      </div>
      <div>
        <label>Priority</label>
        <select id="edit-priority">
          <option value="High">🔴 High</option>
          <option value="Medium">🟠 Medium</option>
          <option value="Low">🟢 Low</option>
        </select>
      </div>
      <div>
        <label>Due Date</label>
        <input type="text" id="edit-due" />
      </div>
      <div style="grid-column:1/-1">
        <label>Comment</label>
        <textarea id="edit-comment"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let tasks = JSON.parse(localStorage.getItem('intel-tasks') || '[]');
  let currentFilter = 'All';
  let editingId = null;
  let draggedTaskId = null;

  function save() {
    localStorage.setItem('intel-tasks', JSON.stringify(tasks));
  }

  // ── Add ────────────────────────────────────────────────────────────────────
  function addTask() {
    const title = document.getElementById('task-title').value.trim();
    if (!title) { alert('Please enter a task title.'); return; }

    tasks.unshift({
      id:       Date.now(),
      title,
      priority: document.getElementById('task-priority').value,
      due:      document.getElementById('task-due').value.trim(),
      comment:  document.getElementById('task-comment').value.trim(),
      done:     false,
      blocked:  false,
      created:  new Date().toLocaleDateString()
    });

    save();
    document.getElementById('task-title').value   = '';
    document.getElementById('task-due').value     = '';
    document.getElementById('task-comment').value = '';
    render();
  }

  // ── Toggle done ────────────────────────────────────────────────────────────
  function toggleDone(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  // ── Delete ─────────────────────────────────────────────────────────────────
  function deleteTask(id) {
    if (!confirm('Delete this task?')) return;
    tasks = tasks.filter(t => t.id !== id);
    save(); render();
  }

  // ── Toggle blocked ─────────────────────────────────────────────────────────
  function toggleBlocked(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.blocked = !t.blocked; save(); render(); }
  }

  // ── Drag reorder ──────────────────────────────────────────────────────────
  function startTaskDragFromLeftClick(event) {
    const item = event.currentTarget;
    const isActionClick = event.target.closest('.task-actions, button, input, textarea, select, a');
    item.draggable = event.button === 0 && !isActionClick;
  }

  function handleTaskDragStart(event, id) {
    if (!event.currentTarget.draggable) {
      event.preventDefault();
      return;
    }
    draggedTaskId = id;
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', String(id));
    event.currentTarget.classList.add('dragging');
  }

  function handleTaskDragOver(event, targetId) {
    if (draggedTaskId === null || draggedTaskId === targetId) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';

    const item = event.currentTarget;
    const midpoint = item.getBoundingClientRect().top + item.offsetHeight / 2;
    item.classList.toggle('drag-over-top', event.clientY < midpoint);
    item.classList.toggle('drag-over-bottom', event.clientY >= midpoint);
  }

  function clearDragMarks() {
    document.querySelectorAll('.task-item').forEach(item => {
      item.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
      item.draggable = false;
    });
  }

  function handleTaskDragLeave(event) {
    event.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
  }

  function handleTaskDrop(event, targetId) {
    if (draggedTaskId === null || draggedTaskId === targetId) return;
    event.preventDefault();

    const dropAfter = event.currentTarget.classList.contains('drag-over-bottom');
    const draggedIndex = tasks.findIndex(t => t.id === draggedTaskId);
    if (draggedIndex === -1) return;

    const [draggedTask] = tasks.splice(draggedIndex, 1);
    const targetIndex = tasks.findIndex(t => t.id === targetId);
    tasks.splice(dropAfter ? targetIndex + 1 : targetIndex, 0, draggedTask);

    save();
    draggedTaskId = null;
    render();
  }

  function handleTaskDragEnd() {
    draggedTaskId = null;
    clearDragMarks();
  }

  // ── Edit Modal ─────────────────────────────────────────────────────────────
  function openEdit(id) {
    const t = tasks.find(t => t.id === id);
    editingId = id;
    document.getElementById('edit-title').value    = t.title;
    document.getElementById('edit-priority').value = t.priority;
    document.getElementById('edit-due').value      = t.due;
    document.getElementById('edit-comment').value  = t.comment;
    document.getElementById('edit-modal').classList.add('open');
  }
  function closeModal() {
    document.getElementById('edit-modal').classList.remove('open');
    editingId = null;
  }
  function saveEdit() {
    const title = document.getElementById('edit-title').value.trim();
    if (!title) { alert('Title cannot be empty.'); return; }
    const t = tasks.find(t => t.id === editingId);
    if (t) {
      t.title    = title;
      t.priority = document.getElementById('edit-priority').value;
      t.due      = document.getElementById('edit-due').value.trim();
      t.comment  = document.getElementById('edit-comment').value.trim();
      save();
    }
    closeModal();
    render();
  }

  // ── Filter ─────────────────────────────────────────────────────────────────
  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function render() {
    renderStats();
    const list = document.getElementById('task-list');
    const visible = tasks.filter(t => {
      if (currentFilter === 'All')     return true;
      if (currentFilter === 'Done')    return t.done;
      if (currentFilter === 'Blocked') return t.blocked && !t.done;
      return t.priority === currentFilter && !t.done;
    });

    if (visible.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.5">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/>
          </svg>
          <p>No tasks found. Add one above!</p>
        </div>`;
      return;
    }

    list.innerHTML = visible.map(t => `
       <div class="task-item ${t.done ? 'done' : (t.blocked ? 'blocked' : '')} priority-${t.priority}"
         data-id="${t.id}"
         tabindex="0"
         draggable="false"
         onmousedown="startTaskDragFromLeftClick(event)"
         ondragstart="handleTaskDragStart(event, ${t.id})"
         ondragover="handleTaskDragOver(event, ${t.id})"
         ondragleave="handleTaskDragLeave(event)"
         ondrop="handleTaskDrop(event, ${t.id})"
         ondragend="handleTaskDragEnd()">
        <div class="task-header">
          <div style="flex:1">
            <div class="task-title">${escHtml(t.title)}</div>
            <div class="task-meta">
              Added ${t.created}${t.due ? ' &nbsp;·&nbsp; Due: ' + escHtml(t.due) : ''}
            </div>
          </div>
          <span class="badge ${t.done ? 'badge-Done' : (t.blocked ? 'badge-Blocked' : 'badge-' + t.priority)}">
            ${t.done ? '✔ Done' : (t.blocked ? '🚫 Blocked' : t.priority)}
          </span>
          <div class="task-actions">
            <button class="btn ${t.done ? 'btn-undo' : 'btn-done'}"
                    onclick="toggleDone(${t.id})">
              ${t.done ? 'Undo' : 'Done'}
            </button>
            <button class="btn ${t.blocked ? 'btn-undo' : 'btn-blocked'}"
                    onclick="toggleBlocked(${t.id})">
              ${t.blocked ? 'Unblock' : '🚫 Block'}
            </button>
            <button class="btn btn-primary" style="padding:5px 12px;font-size:.8rem"
                    onclick="openEdit(${t.id})">Edit</button>
            <button class="btn btn-danger"
                    onclick="deleteTask(${t.id})">Delete</button>
          </div>
        </div>
        ${t.comment ? `<div class="task-comment">${escHtml(t.comment)}</div>` : ''}
      </div>
    `).join('');
  }

  function renderStats() {
    const total   = tasks.length;
    const done    = tasks.filter(t => t.done).length;
    const blocked = tasks.filter(t => t.blocked && !t.done).length;
    const high    = tasks.filter(t => t.priority === 'High'   && !t.done).length;
    const medium  = tasks.filter(t => t.priority === 'Medium' && !t.done).length;
    const low     = tasks.filter(t => t.priority === 'Low'    && !t.done).length;
    document.getElementById('stats').innerHTML = `
      <div class="stat-pill"><span class="dot dot-high"></span>High: ${high}</div>
      <div class="stat-pill"><span class="dot dot-medium"></span>Medium: ${medium}</div>
      <div class="stat-pill"><span class="dot dot-low"></span>Low: ${low}</div>
      <div class="stat-pill"><span class="dot dot-blocked"></span>Blocked: ${blocked}</div>
      <div class="stat-pill"><span class="dot dot-done"></span>Done: ${done} / ${total}</div>
    `;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ── Recurring Templates ────────────────────────────────────────────────────
  let recurringTemplates = JSON.parse(localStorage.getItem('intel-recurring') || '[]');

  function saveRecurring() {
    localStorage.setItem('intel-recurring', JSON.stringify(recurringTemplates));
  }

  function toggleRecurringCard() {
    const body = document.getElementById('recurring-card-body');
    const icon = document.getElementById('recurring-toggle-icon');
    const isHidden = body.style.display === 'none';
    body.style.display = isHidden ? '' : 'none';
    icon.textContent   = isHidden ? '▼' : '▶';
  }

  function updateRecurringForm() {
    const freq = document.getElementById('rec-freq').value;
    document.getElementById('rec-dow-wrap').style.display = freq === 'weekly'  ? '' : 'none';
    document.getElementById('rec-dom-wrap').style.display = freq === 'monthly' ? '' : 'none';
  }

  function addRecurring() {
    const title = document.getElementById('rec-title').value.trim();
    if (!title) { alert('Please enter a task title.'); return; }
    const freq = document.getElementById('rec-freq').value;
    recurringTemplates.push({
      id:         Date.now(),
      title,
      priority:   document.getElementById('rec-priority').value,
      comment:    document.getElementById('rec-comment').value.trim(),
      frequency:  freq,
      dayOfWeek:  parseInt(document.getElementById('rec-dow').value),
      dayOfMonth: parseInt(document.getElementById('rec-dom').value) || 1,
      time:       document.getElementById('rec-time').value,
      lastRun:    ''
    });
    saveRecurring();
    document.getElementById('rec-title').value   = '';
    document.getElementById('rec-comment').value = '';
    renderRecurring();
    checkRecurring();
  }

  function deleteRecurring(id) {
    if (!confirm('Remove this recurring task template?')) return;
    recurringTemplates = recurringTemplates.filter(r => r.id !== id);
    saveRecurring();
    renderRecurring();
  }

  function renderRecurring() {
    const el = document.getElementById('recurring-list');
    if (recurringTemplates.length === 0) {
      el.innerHTML = '<p style="color:#94A3B8;font-size:.85rem;text-align:center;padding:12px 0">No recurring tasks yet. Add one above.</p>';
      return;
    }
    const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    el.innerHTML = recurringTemplates.map(r => {
      let freqLabel = '';
      if (r.frequency === 'daily')   freqLabel = 'Every day';
      if (r.frequency === 'weekly')  freqLabel = 'Every ' + dayNames[r.dayOfWeek];
      if (r.frequency === 'monthly') freqLabel = 'Every month on day ' + r.dayOfMonth;
      return `
        <div class="recurring-row">
          <span style="font-size:1.2rem">🔁</span>
          <div class="recurring-row-info">
            <div class="recurring-row-title">${escHtml(r.title)}</div>
            <div class="recurring-row-meta">
              ${freqLabel} at ${r.time} &nbsp;·&nbsp; ${r.priority} priority
              ${r.lastRun ? ' &nbsp;·&nbsp; Last added: ' + r.lastRun : ' &nbsp;·&nbsp; Not yet run'}
            </div>
          </div>
          <button class="btn btn-danger" onclick="deleteRecurring(${r.id})">Remove</button>
        </div>`;
    }).join('');
  }

  function checkRecurring() {
    const now      = new Date();
    const today    = now.toLocaleDateString();
    const nowHHMM  = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    let changed    = false;

    recurringTemplates.forEach(r => {
      if (r.lastRun === today) return;        // already spawned today
      if (nowHHMM < r.time)   return;        // not time yet
      if (r.frequency === 'weekly'  && now.getDay()  !== r.dayOfWeek)  return;
      if (r.frequency === 'monthly' && now.getDate() !== r.dayOfMonth) return;

      tasks.unshift({
        id:       Date.now() + Math.floor(Math.random() * 999),
        title:    r.title + ' 🔁',
        priority: r.priority,
        due:      '',
        comment:  r.comment,
        done:     false,
        blocked:  false,
        created:  today
      });
      r.lastRun = today;
      changed   = true;
    });

    if (changed) {
      save();
      saveRecurring();
      renderRecurring();
      render();
    }
  }

  // ── Export ─────────────────────────────────────────────────────────────────
  function exportTasks() {
    const blob = new Blob([JSON.stringify(tasks, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tasks.json';
    a.click();
  }

  // ── Import ─────────────────────────────────────────────────────────────────
  function importTasks(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const imported = JSON.parse(e.target.result);
        if (!Array.isArray(imported)) throw new Error();
        if (confirm('Import ' + imported.length + ' tasks? This will REPLACE your current tasks.')) {
          tasks = imported;
          save(); render();
        }
      } catch { alert('Invalid JSON file.'); }
      input.value = '';
    };
    reader.readAsText(file);
  }

  // ── Share Link ─────────────────────────────────────────────────────────────
  function shareLink() {
    const encoded = encodeURIComponent(JSON.stringify(tasks));
    const url = location.origin + location.pathname + '#data=' + encoded;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(
        () => alert('✅ Link copied!\nSend it to your friend — they open the link and confirm to load your tasks.'),
        () => prompt('Copy this link:', url)
      );
    } else {
      prompt('Copy this link:', url);
    }
  }

  // ── Load shared tasks from URL hash on startup ─────────────────────────────
  (function loadFromHash() {
    const hash = location.hash;
    if (!hash.startsWith('#data=')) return;
    try {
      const imported = JSON.parse(decodeURIComponent(hash.slice(6)));
      if (!Array.isArray(imported)) return;
      if (confirm('Load ' + imported.length + ' shared tasks from the link?\nThis will replace your current tasks.')) {
        tasks = imported;
        save();
        history.replaceState(null, '', location.pathname);
      }
    } catch (err) { /* ignore invalid hash */ }
  })();

  // Allow Enter key in title field to submit
  document.getElementById('task-title').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  document.addEventListener('mouseup', clearDragMarks);

  // Close modal on overlay click
  document.getElementById('edit-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // Initial render
  render();
  renderRecurring();
  checkRecurring();
  setInterval(checkRecurring, 60000); // re-check every minute
</script>
